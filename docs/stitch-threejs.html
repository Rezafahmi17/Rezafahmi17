<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_5 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_5" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_5');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js interactive cybernetic particle constellation & floating polyhedron
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || 280;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera.position.z = 24;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Cyberpunk / Obsidian color palette
const primaryColor = new THREE.Color(0xa855f7); // Neon purple
const cyanColor = new THREE.Color(0x06b6d4); // Cyber cyan
const deepViolet = new THREE.Color(0x6366f1); // Indigo

// Ambient & Point lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xa855f7, 2, 50);
pointLight.position.set(10, 10, 10);
scene.add(pointLight);

const pointLight2 = new THREE.PointLight(0x06b6d4, 1.8, 50);
pointLight2.position.set(-10, -10, 10);
scene.add(pointLight2);

// Central floating icosahedron wireframe + core
const group = new THREE.Group();
scene.add(group);

const icosaGeo = new THREE.IcosahedronGeometry(4.2, 1);
const wireMat = new THREE.MeshBasicMaterial({
  color: 0x818cf8,
  wireframe: true,
  transparent: true,
  opacity: 0.35,
});
const wireMesh = new THREE.Mesh(icosaGeo, wireMat);
group.add(wireMesh);

const innerGeo = new THREE.IcosahedronGeometry(2.4, 0);
const innerMat = new THREE.MeshPhongMaterial({
  color: 0xa855f7,
  emissive: 0x3b0764,
  shininess: 90,
  flatShading: true,
  transparent: true,
  opacity: 0.85,
});
const innerMesh = new THREE.Mesh(innerGeo, innerMat);
group.add(innerMesh);

// Outer floating ring
const torusGeo = new THREE.TorusGeometry(6.5, 0.05, 8, 48);
const torusMat = new THREE.MeshBasicMaterial({
  color: 0x06b6d4,
  transparent: true,
  opacity: 0.4,
});
const ring = new THREE.Mesh(torusGeo, torusMat);
ring.rotation.x = Math.PI / 3;
group.add(ring);

group.position.x = 9; // Position towards the right side of the banner

// Interactive particle field (Constellation)
const particleCount = 140;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const speeds = [];

for (let i = 0; i < particleCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * 45;
  positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
  speeds.push({
    x: (Math.random() - 0.5) * 0.015,
    y: (Math.random() - 0.5) * 0.015,
    z: (Math.random() - 0.5) * 0.01,
  });
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Create canvas circle texture for sharp glowing particles
const canvas = document.createElement('canvas');
canvas.width = 16;
canvas.height = 16;
const ctx = canvas.getContext('2d');
const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
grad.addColorStop(0, 'rgba(255,255,255,1)');
grad.addColorStop(0.3, 'rgba(168,85,247,0.9)');
grad.addColorStop(1, 'rgba(168,85,247,0)');
ctx.fillStyle = grad;
ctx.beginPath();
ctx.arc(8, 8, 8, 0, Math.PI * 2);
ctx.fill();

const particleTexture = new THREE.CanvasTexture(canvas);
const particleMat = new THREE.PointsMaterial({
  size: 0.65,
  map: particleTexture,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// Mouse tracking
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

const onMouseMove = (e) => {
  const rect = container.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  targetX = (x / (rect.width || 1) - 0.5) * 3;
  targetY = (y / (rect.height || 1) - 0.5) * -3;
};

window.addEventListener('mousemove', onMouseMove);

// Resize handler
const onResize = () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || 280;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
};
window.addEventListener('resize', onResize);

// Animation Loop
let reqId;
let clock = new THREE.Clock();

const animate = () => {
  reqId = requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  // Smooth mouse follow
  mouseX += (targetX - mouseX) * 0.05;
  mouseY += (targetY - mouseY) * 0.05;

  group.rotation.y = elapsedTime * 0.25 + mouseX * 0.8;
  group.rotation.x = Math.sin(elapsedTime * 0.3) * 0.15 + mouseY * 0.8;
  ring.rotation.z = -elapsedTime * 0.4;

  // Animate particles
  const posArr = particleGeo.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    posArr[i * 3] += speeds[i].x;
    posArr[i * 3 + 1] += speeds[i].y;
    posArr[i * 3 + 2] += speeds[i].z;

    // Boundary wrapping
    if (posArr[i * 3] > 25) posArr[i * 3] = -25;
    if (posArr[i * 3] < -25) posArr[i * 3] = 25;
    if (posArr[i * 3 + 1] > 12) posArr[i * 3 + 1] = -12;
    if (posArr[i * 3 + 1] < -12) posArr[i * 3 + 1] = 12;
  }
  particleGeo.attributes.position.needsUpdate = true;
  particles.rotation.y = elapsedTime * 0.04;

  renderer.render(scene, camera);
};

animate();

// Clean up
return () => {
  cancelAnimationFrame(reqId);
  window.removeEventListener('mousemove', onMouseMove);
  window.removeEventListener('resize', onResize);
  renderer.dispose();
  icosaGeo.dispose();
  innerGeo.dispose();
  torusGeo.dispose();
  particleGeo.dispose();
  wireMat.dispose();
  innerMat.dispose();
  torusMat.dispose();
  particleMat.dispose();
  particleTexture.dispose();
  if (renderer.domElement && renderer.domElement.parentNode) {
    renderer.domElement.parentNode.removeChild(renderer.domElement);
  }
};

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_5 -->
</body>
</html>
